<title>ถอดรหัสลับ ปราสาทเมืองสิงห์</title>
<script>
/* =====================================================================
   ตั้งค่า Firebase (Realtime Database) — วางค่าของคุณที่ firebaseConfig ด้านล่าง
   ---------------------------------------------------------------------
   วิธีตั้งค่าทีละขั้นตอน (ใช้ฟรี ไม่ต้องผูกบัตรเครดิต):

   1) เข้า https://console.firebase.google.com แล้วล็อกอินด้วยบัญชี Google
   2) กด "Create a project" (สร้างโปรเจกต์) ตั้งชื่อ เช่น mueang-singh-game
      แล้วกด Continue — หน้า Google Analytics ปิดไว้ได้ (Disable) แล้วกด Create project
   3) เมื่อสร้างเสร็จ ที่หน้าแรกของโปรเจกต์ กดไอคอน </> (Web) เพื่อเพิ่มเว็บแอป
      ตั้งชื่อแอปอะไรก็ได้ (ไม่ต้องติ๊ก Firebase Hosting) แล้วกด Register app
   4) จะเห็นโค้ดที่มีก้อน const firebaseConfig = { ... }
      ให้คัดลอกค่าข้างในมาใส่ด้านล่างนี้ (apiKey, authDomain, projectId, appId ฯลฯ)
   5) กลับมาที่เมนูซ้าย Build > Realtime Database > กด "Create Database"
      - เลือกภูมิภาค แนะนำ Singapore (asia-southeast1)
      - เลือก "Start in test mode" แล้วกด Enable
   6) คัดลอก URL ของฐานข้อมูลที่ด้านบนของหน้า Realtime Database
      (หน้าตาแบบ https://ชื่อโปรเจกต์-default-rtdb.asia-southeast1.firebasedatabase.app)
      มาใส่ที่ databaseURL ด้านล่าง  *** ขั้นตอนนี้สำคัญมาก ถ้าไม่ใส่ห้องจะเปิดไม่ได้ ***
   7) ไปที่แท็บ Rules ของ Realtime Database วางโค้ดนี้แทนของเดิม แล้วกด Publish
        {
          "rules": {
            "rooms": {
              "$room": { ".read": true, ".write": true }
            }
          }
        }
      (โหมดทดสอบปกติจะหมดอายุใน 30 วัน ถ้าใช้กฎด้านบนจะใช้งานได้ต่อเนื่อง
       ใช้เฉพาะเกมในห้องเรียนเท่านั้น ไม่ควรเก็บข้อมูลส่วนตัวสำคัญ)
   8) บันทึกไฟล์นี้ แล้วนำขึ้นเว็บเพื่อให้มือถือเข้าได้ เช่น
        - Netlify Drop: เข้า https://app.netlify.com/drop แล้วลากไฟล์ index.html ใส่
        - หรือ GitHub Pages / Firebase Hosting
      (ถ้าเปิดไฟล์จากเครื่องตรงๆ ผู้เล่นคนอื่นจะสแกนเข้าไม่ได้)
   9) เปิดเกมจากลิงก์ที่ได้ เล่นจนถึงช่วงแข่งขัน กด "เปิดห้อง" จะมี QR ขึ้นมา
      ลองสแกนด้วยมือถืออีกเครื่องเพื่อทดสอบ

   หมายเหตุ: ถ้ายังไม่ใส่ค่าเหล่านี้ เกมยังเล่นได้ตามปกติ แต่เป็นโหมดเล่นคนเดียว
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAKepTt5BteTDdtCZHl82ALeWV8nFRBlkY",
  authDomain: "prasart-muang-sing.firebaseapp.com",
  databaseURL: "https://prasart-muang-sing-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "prasart-muang-sing",
  storageBucket: "prasart-muang-sing.firebasestorage.app",
  messagingSenderId: "487934807020",
  appId: "1:487934807020:web:a20ebdbe06644b57dc4ec9"
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;800&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --lat:#8f4a2c; --lat-d:#4b2616; --lat-dd:#2b160d;
  --sand:#cfc6b4; --sand-d:#8d8372;
  --moss:#5d7a45; --river:#2c6e62; --river-d:#17433c; --mint:#bfe6d6;
  --gold:#e2b04a; --leaf:#d8cf8c; --leaf-d:#a79a4f; --ink:#2f2010; --red:#e0332b;
  --paper:#f1e6cf;
  --cut:9px;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#1b0f09;color:var(--paper);font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,.serif{font-family:'Noto Serif Thai','Sarabun',serif}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* stepped (temple-tier) corners */
.step{clip-path:polygon(0 var(--cut),var(--cut) var(--cut),var(--cut) 0,calc(100% - var(--cut)) 0,calc(100% - var(--cut)) var(--cut),100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,var(--cut) calc(100% - var(--cut)),0 calc(100% - var(--cut)))}
.card{background:linear-gradient(#3b2316,#2a160d);box-shadow:inset 0 0 0 3px #7a4026,inset 0 0 0 6px #2a160d,inset 0 0 0 7px rgba(226,176,74,.55);padding:26px 26px 22px}
.btn{display:inline-block;background:var(--gold);color:var(--lat-dd);font-weight:700;padding:.65em 1.4em;--cut:6px;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#8fc9bd;touch-action:manipulation;z-index:1}
#world{position:absolute;left:0;top:0;width:1280px;height:540px;transform-origin:0 0;will-change:transform}
#world svg.bg{position:absolute;left:0;top:0;width:1280px;height:540px;overflow:visible}
.ent{position:absolute;transform-origin:50% 100%;width:60px;height:120px}
.ent .flip{width:60px;height:120px}
.ent svg{display:block;overflow:visible}
.tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:15px;font-weight:700;background:rgba(27,15,9,.8);color:var(--paper);padding:1px 10px;border-radius:99px;margin-bottom:2px;pointer-events:none}
.walking .l{animation:stepL .34s ease-in-out infinite alternate}
.walking .r{animation:stepR .34s ease-in-out infinite alternate}
.walking .flip{animation:bob .34s ease-in-out infinite alternate}
.lg{transform-box:fill-box;transform-origin:50% 0}
@keyframes stepL{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes stepR{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
@keyframes bob{from{translate:0 0}to{translate:0 -3px}}
.hs{position:absolute;cursor:pointer;border-radius:10px;z-index:6}
.hs:hover,.hs:focus-visible{background:rgba(226,176,74,.16);outline:2px dashed var(--gold)}
.hs .ping,.ent.hs .ping{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--gold);background:rgba(226,176,74,.25);animation:ping 1.7s ease-out infinite;pointer-events:none}
.ent.hs .ping{top:-6px}
.hs.done .ping,.ent.hs.done .ping{display:none}
.hs.done::after{content:"✓";position:absolute;right:6px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--moss);color:#fff;font-weight:700;display:grid;place-items:center;font-size:16px}
.ent.hs.done::after{display:none}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.7);opacity:0}}
.edge{position:absolute;z-index:4;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;animation:nudge 1.3s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateX(8px)}}
.edge.l{animation-name:nudgeL}
@keyframes nudgeL{to{transform:translateX(-8px)}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
#loc{background:rgba(27,15,9,.82);padding:8px 14px 9px;max-width:min(520px,62vw);pointer-events:auto;--cut:6px}
#loc b{display:block;font-family:'Noto Serif Thai',serif;font-size:1.02rem;color:var(--gold)}
#loc span{font-size:.92rem;line-height:1.35;display:block}
#hudR{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
#nbBtn{background:var(--leaf);color:var(--ink);font-weight:700;padding:9px 14px;display:flex;gap:8px;align-items:center;--cut:6px;box-shadow:inset 0 -4px 0 var(--leaf-d)}
#nbBtn em{font-style:normal;background:var(--lat-dd);color:var(--gold);padding:0 8px;border-radius:99px;font-size:.9rem}
#nbBtn.pulse{animation:pulse 1s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(226,176,74,.5)}}
#beacon{display:flex;align-items:center;gap:8px;background:rgba(27,15,9,.85);padding:6px 12px;font-weight:700;color:#ffd6d2;--cut:6px}
#beacon i{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 12px 3px var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(900px,calc(100vw - 20px));z-index:20;display:flex;gap:14px;align-items:center;min-height:112px;padding:14px 18px;cursor:pointer;background:linear-gradient(#34200f,#25140a);box-shadow:inset 0 0 0 3px #7a4026,inset 0 0 0 4px rgba(226,176,74,.5);--cut:8px}
#dlg.sys{background:linear-gradient(#0f2f2a,#0a1f1c);box-shadow:inset 0 0 0 3px #3fa58f,inset 0 0 0 4px rgba(191,230,214,.5),0 0 30px rgba(63,165,143,.35);color:var(--mint)}
#dlg.nar{justify-content:center;text-align:center;font-style:italic}
#dAv{flex:0 0 76px;height:76px;border-radius:50%;overflow:hidden;background:#d8c9a3;box-shadow:0 0 0 3px var(--gold)}
#dlg.sys #dAv{background:#07211d;box-shadow:0 0 0 3px #3fa58f}
#dAv svg{width:100%;height:100%;display:block}
#dBody{flex:1;min-width:0}
#dName{font-family:'Noto Serif Thai',serif;font-weight:800;color:var(--gold);font-size:1rem;margin-bottom:2px}
#dlg.sys #dName{color:#7fe3c6}
#dText{font-size:1.1rem;line-height:1.6}
#dNext{text-align:right;font-size:.82rem;opacity:.7;animation:blink 1.2s steps(2) infinite}
@media (max-width:560px){#dAv{flex-basis:56px;height:56px}#dText{font-size:1rem}}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:40;background:rgba(15,8,4,.66);display:grid;place-items:center;padding:12px;overflow:auto}
#modalCard{width:min(680px,100%);max-height:96vh;overflow:auto}
#modalCard h2{font-size:1.35rem;color:var(--gold);margin-bottom:10px}
#modalCard p{line-height:1.65;margin:8px 0}
.mini{display:grid;place-items:center;background:rgba(0,0,0,.22);padding:10px;margin:8px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:#4a2c1b;box-shadow:inset 0 0 0 2px #7a4026;--cut:5px;line-height:1.45}
.opt:hover:not([disabled]){background:#5c3822}
.opt[disabled]{opacity:.5;text-decoration:line-through;cursor:not-allowed}
.opt.good{background:#2f5a3a;box-shadow:inset 0 0 0 2px #7bd08a;text-decoration:none;opacity:1}
.note{background:rgba(0,0,0,.25);padding:10px 14px;border-left:4px solid var(--gold);line-height:1.55;margin:10px 0}
.note.sysn{border-color:#3fa58f;color:var(--mint)}
.note.bad{border-color:#e0786f;color:#ffd6d2}
.note.ok{border-color:#7bd08a;color:#d5f5d9}
#huntsvg{width:100%;height:auto;display:block;background:radial-gradient(#b4905c,#8a6a3e);touch-action:manipulation}
#huntsvg .rock{cursor:pointer}
#huntsvg .rock.found .rk{stroke:#7bd08a;stroke-width:5}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- notebook (palm-leaf manuscript) ---------- */
#nb{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:25;background:linear-gradient(#2a160d,#1d0f08);box-shadow:-10px 0 30px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .3s;padding:max(16px,env(safe-area-inset-top)) 16px 16px;overflow:auto}
#nb.open{transform:none}
#nb h2{font-size:1.3rem;color:var(--gold);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#nb ul{list-style:none;padding:0;display:grid;gap:12px}
.leaf{position:relative;display:flex;gap:12px;padding:12px 14px 12px 30px;color:var(--ink);background:repeating-linear-gradient(90deg,#d8cf8c 0 3px,#cfc57f 3px 5px);border-radius:6px 22px 22px 6px;opacity:.6}
.leaf::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#2a160d}
.leaf.got{opacity:1;box-shadow:0 3px 0 var(--leaf-d)}
.leaf b{flex:0 0 42px;height:42px;display:grid;place-items:center;font-family:'Noto Serif Thai',serif;font-size:1.5rem;background:var(--lat);color:#f7e2c2;border-radius:50%}
.leaf h4{font-size:1rem;margin-bottom:2px}
.leaf p{font-size:.93rem;line-height:1.5}
.leaf .chk{margin-left:auto;align-self:center;font-weight:800;font-size:1.4rem;color:#2f6b3a}

#toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-20px);z-index:35;background:var(--moss);color:#fff;padding:10px 18px;font-weight:700;opacity:0;pointer-events:none;transition:.35s;max-width:92vw;text-align:center;--cut:6px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fade{position:fixed;inset:0;background:#1b0f09;opacity:0;pointer-events:none;transition:opacity .35s;z-index:60}
#fade.on{opacity:1}
#alarm{position:fixed;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;animation:redflash .5s steps(2) infinite;background:rgba(224,51,43,.0);box-shadow:inset 0 0 160px 40px rgba(224,51,43,.9)}
#alarm div{font-family:'Noto Serif Thai',serif;font-weight:800;font-size:clamp(2rem,9vw,4.5rem);color:#fff;text-shadow:0 0 20px #e0332b,0 4px 0 #6b0d08;background:rgba(40,0,0,.55);padding:.3em .8em}
@keyframes redflash{50%{background:rgba(224,51,43,.28)}}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:16px;overflow:auto;background:linear-gradient(#1f120b,#3a1f12 60%,#2a160d)}
#title svg.tbg{position:absolute;inset:auto 0 0 0;width:100%;height:56%;opacity:.55}
.tbox{position:relative;width:min(560px,100%);text-align:center}
.tbox h1{font-size:clamp(2.1rem,8vw,3.6rem);line-height:1.15;font-weight:800;color:var(--paper)}
.tbox h1 small{display:block;font-size:.42em;color:var(--gold);font-weight:600;letter-spacing:.04em;margin-bottom:.4em}
.tbox p{margin:14px auto 18px;line-height:1.65;color:#e5d6b8}
.tbox input{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;background:#f1e6cf;color:var(--ink);border:0;margin-bottom:12px;--cut:6px}
.tbox .btn{width:100%;font-size:1.15rem}
.tbox .tiny{font-size:.86rem;opacity:.8}
.linkbtn{color:#d9c79f;text-decoration:underline;font-size:.88rem;margin-top:12px}

/* ---------- quiz ---------- */
#quiz{position:fixed;inset:0;z-index:30;background:rgba(15,8,4,.62);display:grid;place-items:center;padding:10px;overflow:auto}
.qwrap{width:min(780px,100%);max-height:98vh;overflow:auto}
.qcard{padding:22px 24px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qav{flex:0 0 54px;height:54px;border-radius:50%;overflow:hidden;background:#d8c9a3;box-shadow:0 0 0 3px var(--gold)}
.qav svg{width:100%;height:100%;display:block}
.qwho{font-weight:700;line-height:1.25}.qwho small{display:block;font-weight:400;opacity:.8}
.qscore{margin-left:auto;background:var(--lat-dd);padding:4px 12px;border-radius:99px;font-weight:700;color:var(--gold);white-space:nowrap}
.qtext{font-family:'Noto Serif Thai',serif;font-weight:600;font-size:1.2rem;line-height:1.6;margin:6px 0 10px}
.hintbox{margin:10px 0;padding:10px 14px;background:rgba(191,230,214,.1);border-left:4px solid #3fa58f;color:var(--mint);line-height:1.5}
.hintbox li{margin-left:1.1em}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.92rem}
.hostbar{margin-top:10px;padding:14px 18px;background:#1d0f08;box-shadow:inset 0 0 0 2px #5b3320;--cut:6px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:99px;background:#3b2316;font-size:.88rem}
.chip.ok{background:#2f5a3a}
.wall{display:grid;gap:8px;margin:10px 0;max-height:34vh;overflow:auto}
.wall blockquote{background:#4a2c1b;padding:10px 14px;line-height:1.5;border-left:4px solid var(--gold)}
.wall blockquote cite{display:block;font-size:.84rem;opacity:.75;margin-top:4px;font-style:normal}
textarea{width:100%;min-height:120px;font:inherit;font-size:1.05rem;padding:12px;background:#f1e6cf;color:var(--ink);border:0;resize:vertical;--cut:6px}
table.board{width:100%;border-collapse:collapse;margin:8px 0}
table.board th,table.board td{padding:7px 8px;text-align:left;border-bottom:1px solid #5b3320}
table.board th{color:var(--gold);font-size:.9rem}

/* ---------- join (phone) ---------- */
#joinApp{position:fixed;inset:0;z-index:56;background:linear-gradient(#1f120b,#3a1f12);overflow:auto;padding:14px}
.jwrap{width:min(560px,100%);margin:0 auto}
.jwrap h1{font-size:1.5rem;margin:10px 0 6px}
.jwrap input{width:100%;font:inherit;font-size:1.1rem;padding:12px;background:#f1e6cf;color:var(--ink);border:0;margin:10px 0;--cut:6px}
.qr{display:inline-block;padding:10px;background:#f1e6cf}
.qr img,.qr canvas{display:block}
.codebig{font-family:'Noto Serif Thai',serif;font-weight:800;font-size:2rem;letter-spacing:.12em;color:var(--gold)}

#arrow{position:fixed;z-index:22;width:170px;text-align:center;pointer-events:none;animation:arrowb .8s ease-in-out infinite alternate}
#arrow svg{display:block;margin:0 auto}
#arrow span{display:inline-block;background:var(--gold);color:var(--lat-dd);font-weight:700;padding:3px 10px;font-size:.9rem;--cut:4px}
@keyframes arrowb{to{transform:translateY(10px)}}
.num{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--gold);color:var(--lat-dd);font:800 18px/34px 'Noto Serif Thai',serif;text-align:center;font-style:normal;box-shadow:0 0 0 3px var(--lat-dd),0 0 0 6px rgba(226,176,74,.6);animation:pulse 1.6s ease-in-out infinite;pointer-events:none}
.hs.done .num{background:var(--moss);color:#fff;animation:none}
.vals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
@media(max-width:560px){.vals{grid-template-columns:1fr}}
.val{background:#4a2c1b;padding:12px 14px;border-top:4px solid var(--gold)}
.val:nth-child(2){border-color:#d99b5b}.val:nth-child(3){border-color:#b8693f}.val:nth-child(4){border-color:#3fa58f}
.val h4{font-family:'Noto Serif Thai',serif;margin:6px 0;font-size:1rem}

  if(s.left)world.insertAdjacentHTML('beforeend',`<div class="edge l" style="left:14px;top:380px;z-index:7">${s.left.label}</div>`);
  s.npcs().forEach(n=>world.appendChild(npcEl(n)));
  P.x=side==='r'?W-120:side==='l'?120:(s.start?s.start.l[0]:150);P.y=410;P.tx=P.x;P.ty=P.y;P.moving=false;P.pending=null;P.lock=performance.now()+700;
  P.el=entEl('me',CH.me,P.x,P.y,G.name);world.appendChild(P.el);
  renderHS();camX=clamp(P.x*S-VW/2,0,Math.max(0,W*S-VW));applyCam();setObj();
}
function applyCam(){const max=Math.max(0,W*S-VW);const t=clamp(P.x*S-VW/2,0,max);camX+=(t-camX)*.12;if(Math.abs(t-camX)<.5)camX=t;world.style.transform=`translate(${-camX}px,${offY}px) scale(${S})`;}

async function goScene(id,side,after){
  fading=true;$('#fade').classList.add('on');await wait(380);
  build(id,side);await wait(80);$('#fade').classList.remove('on');await wait(360);fading=false;
  if(after)after();
}

let last=performance.now();
function tick(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(P.el&&!isBusy()){
    if(keys.size){const dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);const dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);
      P.pending=null;P.tx=clamp(P.x+dx*160,30,W-30);P.ty=clamp(P.y+dy*60,BAND[0],BAND[1]);P.moving=true;P.el.classList.add('walking');}
    if(P.moving){
      const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy);
      if(d<5){P.moving=false;P.el.classList.remove('walking');const f=P.pending;P.pending=null;if(f)f();}
      else{const sp=290*dt;const m=Math.min(sp,d);P.x+=dx/d*m;P.y+=dy/d*m;if(Math.abs(dx)>3){P.face=dx>0?1:-1;$('.flip',P.el).style.transform=`scaleX(${P.face})`;}}
      setPos(P.el,P.x,P.y);
    }
    checkTriggers(t);
  }
  applyCam();requestAnimationFrame(tick);
}
function checkTriggers(t){
  if(t<P.lock||fading)return;
  const s=SC[G.scene];
  if(G.scene==='S2'&&!G.f.stumbled&&P.x>1010&&P.moving){stopWalk();stumble();return;}
  if(P.x>=W-48&&P.tx>P.x&&s.right){tryExit('r');}
  else if(P.x<=48&&P.tx<P.x&&s.left){tryExit('l');}
}

function tryExit(dir){
  stopWalk();
  const sc=G.scene;
  const block=msg=>{P.x+=dir==='r'?-70:70;setPos(P.el,P.x,P.y);P.tx=P.x;say([{w:'sys',t:msg}]);};
  if(sc==='S1'){ if(dir==='r'){ if(!G.f.sys)return block('ยังไม่ต้องรีบนะ ไปคุยกับอาจารย์นิวก่อน'); return goScene('S2','l',onEnterS2);} }
  if(sc==='S2'){ if(dir==='l')return goScene('S1','r'); return goScene('S3','l',onEnterS3); }
  if(sc==='S3'){ if(dir==='l')return goScene('S2','r');
    const k=Object.keys(G.f.st).length;
    if(k<3)return block('สำรวจครบรึยังน้า? รูปเคารพยังคลิกไม่ครบ 3 องค์ ย้อนกลับไปคลิกให้ครบก่อนนะ');
    if(!G.items.d)return block('สำรวจครบรึยังน้า? ยังตอบข้อสังเกตของฉันไม่จบ คลิกที่รูปเคารพอีกครั้งเพื่อเริ่มใหม่นะ');
    if(!G.items.c)return block('สำรวจครบรึยังน้า? ยังหาหินศิลาแลงไม่ครบ 3 ก้อน ย้อนกลับไปหาที่ภายนอกปราสาทก่อนนะ');
    if(!G.items.b)return block('สำรวจครบรึยังน้า? ที่ภายนอกปราสาทยังสำรวจไม่ครบ 4 จุด ย้อนกลับไปคลิกหมายเลข 1–4 ให้ครบก่อนนะ');
    return goScene('S4','l',onEnterS4);}
}

/* --- สะดุดศิลาแลง + เกมหาของ --- */
function rockPoly(r,cx,cy,sz,sx=1.15,sy=.85){const a=[];const n=9;for(let i=0;i<n;i++){const t=i/n*Math.PI*2+r()*.3;const k=sz*(.78+r()*.4);a.push(`${(cx+Math.cos(t)*k*sx).toFixed(1)},${(cy+Math.sin(t)*k*sy).toFixed(1)}`);}return a.join(' ');}
function rockSVG(r,cx,cy,type,sz=36){
  const poly=rockPoly(r,cx,cy,sz);
  if(type==='lat'){let pits='';for(let i=0;i<10;i++)pits+=`<circle cx="${(cx+(r()-.5)*sz*1.5).toFixed(1)}" cy="${(cy+(r()-.5)*sz*1.0).toFixed(1)}" r="${(1.5+r()*2).toFixed(1)}" fill="#5e2312"/>`;
    return `<polygon class="rk" points="${poly}" fill="#a2492b" stroke="#6b2a15" stroke-width="3"/>${pits}`;}
  const fills={gray:'#9d9a94',tan:'#cdb88e',dark:'#4a4a55',clay:'#b9633f',moss:'#6f7f55'};
  return `<polygon class="rk" points="${poly}" fill="${fills[type]}" stroke="#3d3326" stroke-width="3"/><path d="M${cx-sz*.5} ${cy-sz*.15}q${sz*.5} -${sz*.3} ${sz} 0" stroke="#fff" stroke-width="2" fill="none" opacity=".3"/>`;
}

const RUB={4:'ตอบถูกทันทีในครั้งแรก',3:'ตอบถูกหลังดูคำใบ้ 1 ครั้ง',2:'ตอบผิดก่อน แล้วตอบถูก',1:'ตอบไม่ถูก / ข้ามข้อ'};
const RUB_SKIP_SCORE=1; // คะแนนเมื่อตอบไม่ถูก/ข้ามข้อ (แก้ตัวเลขตรงนี้ได้)
function makeMe(name){return{name,score:0,hints:0,correct:0,skipped:0,refl:'',q:{},order:{}};}
const qs=(me,qi)=>me.q[qi]||(me.q[qi]={wrong:[],hintN:0,done:false,ok:false,pts:0});
function rubric(s){if(!s||!s.done||!s.ok)return RUB_SKIP_SCORE;if((s.wrong||[]).length)return 2;return s.hintN?3:4;}
function viewOf(me,qi){
  const q=Q[qi],s=qs(me,qi);
  const ord=me.order[qi]||(me.order[qi]=shuffle([0,1,2,3]));
  return{qi,total:Q.length,who:q.who,whoName:q.whoName,text:q.text,choices:ord.map(i=>({i,t:q.c[i]})),wrong:s.wrong.slice(),
    hints:q.h.slice(0,s.hintN),hintN:s.hintN,hintMax:q.h.length,done:s.done,ok:s.ok,pts:s.pts,lv:s.done?s.pts:0,
    explain:s.done?q.exp:null,answer:s.done?q.a:null,score:me.score,left:2-s.wrong.length};
}
function answerOn(me,qi,ch){
  const s=qs(me,qi);if(s.done||s.wrong.includes(ch))return;
  if(ch===Q[qi].a){s.done=true;s.ok=true;s.pts=rubric(s);me.score+=s.pts;me.correct++;}
  else{s.wrong.push(ch);if(s.wrong.length>=2){s.done=true;s.ok=false;s.pts=RUB_SKIP_SCORE;me.score+=s.pts;me.skipped++;}}
}
function hintOn(me,qi){const s=qs(me,qi);if(!s.done&&s.hintN<Q[qi].h.length){s.hintN++;me.hints++;}}
function saveMe(){
  if(!db||!R.code||!R.pid||!R.me)return;
  roomRef('players/'+R.pid).update({name:R.me.name,score:R.me.score,hints:R.me.hints,correct:R.me.correct,skipped:R.me.skipped,refl:R.me.refl||'',q:R.me.q}).catch(()=>{});
}
function allPlayers(){
  const o={...R.remote};
  if(R.me&&R.pid==='host')o.host={...(o.host||{}),name:R.me.name,score:R.me.score,hints:R.me.hints,correct:R.me.correct,skipped:R.me.skipped,refl:R.me.refl,q:R.me.q,online:true};
  return o;
}
const leaders=()=>Object.values(allPlayers()).filter(p=>p&&p.name).sort((a,b)=>(b.score||0)-(a.score||0));
function boardData(){
  return leaders().map(p=>({n:p.name,s:p.score||0,h:p.hints||0,c:p.correct||0,k:p.skipped||0,r:p.refl||'',
    q:Q.map((_,i)=>{const s=p.q&&p.q[i];return s&&s.done?{lv:rubric(s),h:s.hintN||0}:null;})}));
}

/* ---- ตัวแสดงผลคำถาม (ใช้ทั้งจอหลักและมือถือผู้เล่น) ---- */
function renderQ(root,v,act){
  const ch=v.choices.map(c=>{const wrong=v.wrong.includes(c.i),good=v.done&&c.i===v.answer;
    return `<button class="opt step ${good?'good':''}" data-i="${c.i}" ${(wrong||v.done)?'disabled':''}>${esc(c.t)}</button>`;}).join('');
  let fb='';
  if(v.done)fb=v.ok?`<div class="note ok"><b>ถูกต้อง! ได้ ${v.lv} คะแนน</b> <small>(${RUB[v.lv]})</small><br>${esc(v.explain)}</div>`
    :`<div class="note bad"><b>ข้ามข้อนี้ ได้ ${v.pts} คะแนน</b> <small>(ตอบผิดครบ 2 ครั้ง)</small><br>${esc(v.explain)}</div>`;
  else if(v.wrong.length)fb=`<div class="note bad">ยังไม่ถูก ลองอีกครั้ง — เหลือโอกาสอีก ${v.left} ครั้ง</div>`;
  const hints=v.hints.length?`<div class="hintbox"><b>คำใบ้:</b> ${v.hints.map(h=>esc(h)).join('<br>')}</div>`:'';
  root.innerHTML=`<div class="qcard card step">
   <div class="qhead"><div class="qav">${avatarHTML(v.who)}</div><div class="qwho">${esc(v.whoName)} ถาม<small>ข้อ ${v.qi+1} จาก ${v.total}</small></div><div class="qscore">${v.score} คะแนน</div></div>
   <div class="qtext">${esc(v.text)}</div>${ch}${hints}${fb}
   <div class="qfoot"><span>ตอบผิดได้ 2 ครั้ง • ดูคำใบ้แล้ว <b>${v.hintN}/${v.hintMax}</b> ครั้ง</span>
   <button class="btn ghost step hintbtn" ${(v.done||v.hintN>=v.hintMax)?'disabled':''}>ขอคำใบ้</button></div></div>`;
  $$('.opt',root).forEach(b=>b.onclick=()=>act.answer(+b.dataset.i));
  $('.hintbtn',root).onclick=()=>act.hint();
}

    const hd=['อันดับ','ชื่อ',...Q.flatMap((_,i)=>[`ข้อ${i+1} คะแนน`,`ข้อ${i+1} ดูคำใบ้`]),'คะแนนรวม','ดูคำใบ้รวม','ความคิดเห็น'].join(',');
    const rows=b.map((r,i)=>[i+1,q(r.n),...r.q.flatMap(x=>x?[x.lv,x.h]:['','']),r.s,r.h,q(r.r)].join(','));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[hd,...rows].join('\n')],{type:'text/csv;charset=utf-8'}));a.download='ผลเกมปราสาทเมืองสิงห์.csv';a.click();
  };
  $('#againBtn').onclick=()=>location.reload();
}

/* =====================================================================
   ฝั่งผู้เล่นคนอื่น (มือถือ) — เปิดผ่านลิงก์ #join=รหัส
   ===================================================================== */
function startJoiner(code){
  $('#title').hidden=true;$('#stage').hidden=true;$('#joinApp').hidden=false;
  R.code=code;
  const root=$('#joinApp');
  root.innerHTML=`<div class="jwrap"><h1 class="serif">ถอดรหัสลับ ปราสาทเมืองสิงห์</h1><p>เข้าร่วมห้อง <b class="codebig" style="font-size:1.3rem">${esc(code)}</b></p>
   <form id="jf"><label for="jn">ชื่อของคุณ</label><input id="jn" maxlength="16" placeholder="เช่น น้องมิ้นต์" autocomplete="off" required><button class="btn step" style="width:100%" type="submit">เข้าร่วม</button></form><div id="jbody"></div></div>`;
  const show=h=>{$('#jbody').innerHTML=h;};
  const retry='<p style="margin-top:10px"><button class="btn step" onclick="location.reload()">ลองใหม่</button></p>';
  let saved='';try{saved=sessionStorage.getItem('singh_'+code)||'';}catch(e){}
  let shownQ=-1,first=true,lastAlarm=0;
  function showQ(qi){
    if(shownQ!==qi||!$('#jq')){show('<div id="jq" style="margin-top:12px"></div><p id="jwait" style="text-align:center;margin-top:10px;opacity:.85"></p>');shownQ=qi;}
    const v=viewOf(R.me,qi);
    renderQ($('#jq'),v,{answer:i=>{answerOn(R.me,qi,i);saveMe();showQ(qi);},hint:()=>{hintOn(R.me,qi);saveMe();showQ(qi);}});
    $('#jwait').textContent=v.done?'รอผู้คุมจอไปข้อถัดไป…':'';
  }
  function showReflect(){
    show(`<div class="card step" style="margin-top:14px"><h2 class="serif" style="color:var(--gold)">ปิดท้ายภารกิจ</h2><div class="qtext">${REFLECT_Q}</div><p style="opacity:.9">${REFLECT_HINT}</p>${ASPECTS}
     <textarea id="jr" maxlength="400" placeholder="พิมพ์ความคิดเห็นของคุณ…">${esc(R.me.refl||'')}</textarea>
     <div class="row"><button class="btn step" id="jsend">ส่งความคิดเห็น</button></div><div id="jok"></div></div>`);
    $('#jsend').onclick=()=>{R.me.refl=$('#jr').value.trim();saveMe();$('#jok').innerHTML='<div class="note ok">ส่งแล้ว! แก้ไขแล้วกดส่งซ้ำได้</div>';};
  }
  function showEnd(){
    roomRef('players').once('value').then(s=>{R.remote=s.val()||{};
      show(`<div class="card step" style="margin-top:14px"><h2 class="serif" style="color:var(--gold)">สรุปผล</h2>${valuesHTML()}${boardHTML(boardData())}</div>`);});
  }
  function onState(s){
    if(!s){show('<div class="note bad">ห้องนี้ถูกปิดแล้ว</div>'+retry);return;}
    if(first){lastAlarm=s.alarm||0;first=false;}
    else if(s.alarm&&s.alarm!==lastAlarm){lastAlarm=s.alarm;const a=$('#alarm');a.hidden=false;setTimeout(()=>a.hidden=true,2400);}
    R.phase=s.phase;
    if(s.phase==='quiz')showQ(s.qi);
    else if(s.phase==='reflect')showReflect();
    else if(s.phase==='end')showEnd();
    else show(`<div class="card step" style="margin-top:14px"><p>${s.phase==='lobby'?'เข้าห้องแล้ว! รอผู้คุมจอกดเริ่มแข่งขัน…':'กำลังเตรียมคำถามถัดไป…'}</p></div>`);
  }
  $('#jf').onsubmit=async e=>{
    e.preventDefault();const name=$('#jn').value.trim()||'ผู้เล่น';$('#jf').hidden=true;
    if(!fbInit()){show(`<div class="note bad">${esc(R.err)}</div>`+retry);return;}
    show('<div class="note sysn">กำลังเข้าห้อง…</div>');
    try{
      const st=await roomRef('state').once('value');
      if(!st.exists()){show('<div class="note bad">ไม่พบห้องนี้ ตรวจรหัสห้อง หรือให้ผู้คุมจอเปิดห้องก่อน</div>'+retry);return;}
      R.pid=saved||('p'+Math.random().toString(36).slice(2,9));
      try{sessionStorage.setItem('singh_'+code,R.pid);}catch(e2){}
      R.me=makeMe(name);
      const old=await roomRef('players/'+R.pid).once('value');
      if(old.exists()){const o=old.val();Object.assign(R.me,{score:o.score||0,hints:o.hints||0,correct:o.correct||0,skipped:o.skipped||0,refl:o.refl||''});
        Object.keys(o.q||{}).forEach(k=>{const s=o.q[k];if(s)R.me.q[k]={wrong:s.wrong||[],hintN:s.hintN||0,done:!!s.done,ok:!!s.ok,pts:s.pts||0};});}
      saveMe();
      const pr=roomRef('players/'+R.pid+'/online');pr.set(true);pr.onDisconnect().set(false);
      roomRef('state').on('value',snap=>onState(snap.val()));
    }catch(err){show(`<div class="note bad">เชื่อมต่อไม่ได้: ${esc(err.message)}</div>`+retry);}
  };
}

/* ---------------- เริ่มเกม ---------------- */
$('#nameForm').onsubmit=e=>{
  e.preventDefault();G.name=($('#nameIn').value.trim()||'ผู้เล่น').slice(0,16);
  $('#title').hidden=true;$('#hud').hidden=false;renderNB();
  build('S1');
  say([{w:null,t:'วันนี้โรงเรียนได้พาคุณมาท่องเที่ยวที่ปราสาทเมืองสิงห์ จังหวัดกาญจนบุรี แต่ 8 โมงเป็นเวลาที่เช้าเกินไปสำหรับคุณ คุณแค่คิดว่าจะรีบๆ ฟังอาจารย์บรรยายให้จบแล้วกลับบ้านดีกว่า'}],askReady);
};
function askReady(){
  const c=openModal(`<h2 class="serif">คุณพร้อมแล้วรึยัง?</h2><div class="note">เตรียมตัวให้ดี ก่อนเริ่มภารกิจถอดรหัสลับ</div><button class="opt step" id="rYes">พร้อมแล้ว!</button><button class="opt step" id="rNo">ยังไม่พร้อม…</button>`);
  $('#rYes',c).onclick=()=>{closeModal();toast('คลิกที่อาจารย์นิวเพื่อพูดคุย');};
  $('#rNo',c).onclick=()=>{closeModal();say([{w:null,t:'ว้า คุณไม่มีทางเลือกหรอก เพราะเกมนี้มัน linear ไปกันต่อออ'}],()=>toast('คลิกที่อาจารย์นิวเพื่อพูดคุย'));};
}
$('#skipBtn').onclick=()=>{
  G.name=($('#nameIn').value.trim()||'ผู้เล่น').slice(0,16);Object.keys(G.items).forEach(k=>G.items[k]=1);
  Object.assign(G.f,{talk:2,sys:1,s2:1,s3:1,stumbled:1,riverDone:1});
  $('#title').hidden=true;$('#hud').hidden=false;renderNB();build('S4');onEnterS4();
};
requestAnimationFrame(tick);
(function init(){
  const m=location.hash.match(/join=([A-Za-z0-9]+)/);
  if(m)startJoiner(m[1].toUpperCase());
  else $('#nameIn').focus();
})();
</script>
